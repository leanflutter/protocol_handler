name: protocol_handler_plus_ios
description: iOS implementation of the protocol_handler_plus plugin.
version: 2.0.0
repository: https://github.com/stan-at-work/protocol_handler_plus/tree/main/packages/protocol_handler_plus_ios
homepage: https://github.com/stan-at-work/protocol_handler_plus/tree/main/packages/protocol_handler_plus_ios
issue_tracker: https://github.com/stan-at-work/protocol_handler_plus/issues
topics: 
  - deeplinking
  - protocol

environment:
  sdk: ">=3.10.0 <4.0.0"
  flutter: ">=3.16.0"

