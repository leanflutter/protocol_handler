dependencies:
  flutter:
    sdk: flutter

  protocol_handler_plus_platform_interface: ^2.0.0
    
dev_dependencies:
  flutter_test:
    sdk: flutter
  
flutter:
  plugin:
    implements: protocol_handler_plus
    platforms:
      ios:
        pluginClass: ProtocolHandlerPlusIosPlugin
