name: protocol_handler
description: This plugin allows Flutter apps to register and handle custom protocols (i.e. deep linking).
version: 0.3.0
homepage: https://github.com/leanflutter/protocol_handler

platforms:
  android:
  ios:
  macos:
  windows:

topics:
  - deep-linking
  - url-scheme
  - protocol-handler

environment:
  sdk: ^3.13.0
  flutter: ">=3.47.0"

dependencies:
  flutter:
    sdk: flutter
  nativeapi: ^0.5.11

dev_dependencies:
  dependency_validator: ^3.0.0
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

# The native parts only capture URLs that arrive before Dart runs and hand them
# to the nativeapi core library, which implements everything else.
flutter:
  plugin:
    platforms:
      android:
        package: dev.leanflutter.plugins.protocol_handler
        pluginClass: ProtocolHandlerPlugin
      ios:
        pluginClass: ProtocolHandlerPlugin
      macos:
        pluginClass: ProtocolHandlerPlugin
      windows:
        pluginClass: ProtocolHandlerPluginCApi
